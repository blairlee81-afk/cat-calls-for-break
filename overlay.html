<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Break</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      -webkit-app-region: no-drag;
    }

    /* Dark blur backdrop */
    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 1s ease;
    }
    #backdrop.visible { opacity: 1; }

    /* Cat — loops left to right continuously */
    @keyframes walkLoop {
      from { left: -60vw; }
      to   { left: 110vw; }
    }
    @keyframes walkOut {
      to { left: 110vw; }
    }
    #cat-wrap {
      position: fixed;
      bottom: 0;
      left: -60vw;
      z-index: 10;
    }
    #cat-wrap.show {
      animation: walkLoop 18s linear infinite;
    }
    #cat-wrap.hide {
      animation: walkOut 1.5s ease-in forwards;
    }
    #cat-canvas {
      width: 55vw;
      max-width: 700px;
      min-width: 360px;
      height: auto;
      display: block;
    }

    /* Card — center screen, gradient glass */
    #card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%) scale(0.95);
      opacity: 0;
      transition: opacity 0.7s ease 0.2s, transform 0.7s ease 0.2s;
      z-index: 20;

      background: linear-gradient(
        135deg,
        rgba(0, 140, 160, 0.45) 0%,
        rgba(60, 20, 140, 0.55) 100%
      );
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 36px 44px 40px;
      width: 480px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(0,220,220,0.15),
        0 32px 80px rgba(0,0,0,0.5);
    }
    #card.visible {
      opacity: 1;
      transform: translate(-50%, -46%) scale(1);
    }

    /* Quit button inside card */
    #quit-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #quit-btn:hover { background: rgba(255,60,60,0.45); color: #fff; }

    /* Message */
    #message {
      font-size: 17px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(255,255,255,0.92);
      margin-bottom: 20px;
    }

    /* Countdown — big gradient number */
    #countdown {
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      background: linear-gradient(90deg, #00E5CC 0%, #A855F7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    #countdown-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #00D4C0;
      margin-bottom: 28px;
    }

    /* Snooze button */
    #snooze-btn {
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(0,220,200,0.5);
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      font-weight: 500;
      padding: 12px 36px;
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      letter-spacing: 0.3px;
    }
    #snooze-btn:hover {
      background: rgba(0,220,200,0.18);
      border-color: rgba(0,220,200,0.9);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="backdrop"></div>

  <div id="cat-wrap">
    <video id="cat-video" autoplay loop muted playsinline style="display:none">
      <source src="assets/cat.mp4" type="video/mp4">
    </video>
    <canvas id="cat-canvas"></canvas>
  </div>

  <div id="card">
    <button id="quit-btn">✕</button>
    <div id="message"></div>
    <div id="countdown">3:00</div>
    <div id="countdown-label">Minutes of Rest</div>
    <button id="snooze-btn">Snooze 20 min ✦</button>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
